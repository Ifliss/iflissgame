<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA WORD MASTER - 8 LETTRES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="Mots.js"></script>
    <script src="Dictionnaire.js"></script>

    <style>
        :root {
            --pink-correct: #ff2d75;
            --purple-misplaced: #7f00ff;
            --blue-text: #00d4ff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            background: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        /* --- STYLE DES STATISTIQUES --- */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .stat-item { text-align: center; font-size: 0.7rem; text-transform: uppercase; }
        .stat-item span { display: block; color: var(--blue-text); font-weight: bold; font-size: 1.1rem; }

        .game-info { text-align: center; margin-bottom: 10px; }
        .letter-count { font-size: 0.8rem; color: #555; letter-spacing: 2px; margin: 0; }
        .attempts-count { font-size: 1rem; color: var(--pink-correct); font-weight: bold; }

        #input-line {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .tile {
            aspect-ratio: 1/1;
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            background: var(--glass);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.3rem; font-weight: bold; text-transform: uppercase;
        }

        .tile.correct { background: var(--pink-correct); border-color: transparent; box-shadow: 0 0 15px var(--pink-correct); }
        .tile.pop { border-color: var(--blue-text); }

        .keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 600px; margin-top: auto; padding-bottom: 10px; }
        .key-row { display: flex; justify-content: center; gap: 4px; }
        .key {
            background: var(--glass); border: 1px solid var(--glass-border); color: white;
            border-radius: 4px; padding: 15px 2px; cursor: pointer; flex: 1;
            text-align: center; font-size: 0.9rem; font-weight: bold;
        }
        .key.wide { flex: 1.5; background: rgba(255,255,255,0.15); }

        #msg-toast {
            position: fixed; top: 15%; background: var(--pink-correct);
            padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 3000;
        }

        .misplaced-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; min-height: 35px; }
        .misplaced-letter {
            width: 30px; height: 30px; background: var(--purple-misplaced);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; font-weight: bold;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 4000;
        }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item">🏆 VIC.<span id="stat-win">0</span></div>
        <div class="stat-item">💀 DÉF.<span id="stat-loss">0</span></div>
        <div class="stat-item">⚡ ONE SHOT<span id="stat-oneshot">0</span></div>
    </div>

    <div class="game-info">
        <p class="letter-count">8 LETTRES</p>
        <div class="attempts-count" id="attempts-left">ESSAIS : 7</div>
    </div>

    <div id="msg-toast">MOT INCONNU</div>
    
    <div id="input-line"></div>

    <div id="misplaced-container" class="misplaced-container"></div>

    <div class="keyboard" id="keyboard">
        <div class="key-row">
            <div class="key" onclick="handleInput('A')">A</div><div class="key" onclick="handleInput('Z')">Z</div><div class="key" onclick="handleInput('E')">E</div><div class="key" onclick="handleInput('R')">R</div><div class="key" onclick="handleInput('T')">T</div><div class="key" onclick="handleInput('Y')">Y</div><div class="key" onclick="handleInput('U')">U</div><div class="key" onclick="handleInput('I')">I</div><div class="key" onclick="handleInput('O')">O</div><div class="key" onclick="handleInput('P')">P</div>
        </div>
        <div class="key-row">
            <div class="key" onclick="handleInput('Q')">Q</div><div class="key" onclick="handleInput('S')">S</div><div class="key" onclick="handleInput('D')">D</div><div class="key" onclick="handleInput('F')">F</div><div class="key" onclick="handleInput('G')">G</div><div class="key" onclick="handleInput('H')">H</div><div class="key" onclick="handleInput('J')">J</div><div class="key" onclick="handleInput('K')">K</div><div class="key" onclick="handleInput('L')">L</div><div class="key" onclick="handleInput('M')">M</div>
        </div>
        <div class="key-row">
            <div class="key wide" onclick="handleInput('BACKSPACE')">⌫</div>
            <div class="key" onclick="handleInput('W')">W</div><div class="key" onclick="handleInput('X')">X</div><div class="key" onclick="handleInput('C')">C</div><div class="key" onclick="handleInput('V')">V</div><div class="key" onclick="handleInput('B')">B</div><div class="key" onclick="handleInput('N')">N</div>
            <div class="key wide" onclick="handleInput('ENTER')">OK</div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <h1 id="res-title" style="font-size: 2.5rem; margin-bottom: 10px;"></h1>
        <p id="res-word" style="font-size: 1.2rem; margin-bottom: 30px;"></p>
        <button style="padding: 15px 40px; border-radius: 30px; border: none; background: var(--blue-text); font-weight: bold; cursor: pointer;" onclick="initGame()">REJOUER</button>
    </div>

    <script>
        let targetWord = "";
        let attempts = 7;
        let currentGuess = new Array(8).fill("");
        let fixedLetters = new Array(8).fill(null);
        let misplacedLetters = new Set();
        
        // Stats persistantes
        let stats = JSON.parse(localStorage.getItem('wordStats')) || { wins: 0, losses: 0, oneshots: 0 };

        function initGame() {
            // ÉTAPE 1 : CHOISIR LE MOT DANS MOTS.JS
            // On nettoie les mots (Majuscules + Suppression d'espaces)
            const listMots = MOTS.map(m => m.toUpperCase().trim());
            targetWord = listMots[Math.floor(Math.random() * listMots.length)];
            
            attempts = 7;
            fixedLetters = new Array(8).fill(null);
            currentGuess = new Array(8).fill("");
            misplacedLetters.clear();
            
            document.getElementById('overlay').style.display = "none";
            updateDisplay();
        }

        function handleInput(key) {
            if (key === 'ENTER') {
                if (!currentGuess.includes("")) checkWord();
            } else if (key === 'BACKSPACE') {
                for (let i = 7; i >= 0; i--) {
                    if (!fixedLetters[i] && currentGuess[i] !== "") {
                        currentGuess[i] = ""; break;
                    }
                }
            } else if (key.length === 1 && /^[a-zA-Z]$/.test(key)) {
                for (let i = 0; i < 8; i++) {
                    if (!fixedLetters[i] && currentGuess[i] === "") {
                        currentGuess[i] = key.toUpperCase(); break;
                    }
                }
            }
            renderLine();
        }

        function checkWord() {
            const guessStr = currentGuess.join("").toUpperCase();
            
            // ÉTAPE 2 : VÉRIFIER DANS LE DICTIONNAIRE COMPLET
            const dictMaj = DICTIONNAIRE.map(m => m.toUpperCase().trim());

            if (!dictMaj.includes(guessStr)) {
                showToast("MOT INCONNU");
                document.getElementById('input-line').style.animation = "shake 0.3s ease";
                setTimeout(() => document.getElementById('input-line').style.animation = "", 300);
                return;
            }

            let win = true;
            let tempMisplaced = [];

            for (let i = 0; i < 8; i++) {
                if (currentGuess[i] === targetWord[i]) {
                    fixedLetters[i] = currentGuess[i];
                    misplacedLetters.delete(currentGuess[i]);
                } else {
                    win = false;
                    if (targetWord.includes(currentGuess[i])) tempMisplaced.push(currentGuess[i]);
                    currentGuess[i] = ""; 
                }
            }

            tempMisplaced.forEach(l => { if (!fixedLetters.includes(l)) misplacedLetters.add(l); });

            if (win) {
                stats.wins++;
                if (attempts === 7) stats.oneshots++;
                saveStats();
                endGame(true);
            } else {
                attempts--;
                if (attempts <= 0) {
                    stats.losses++;
                    saveStats();
                    endGame(false);
                }
            }
            updateDisplay();
        }

        function saveStats() {
            localStorage.setItem('wordStats', JSON.stringify(stats));
        }

        function updateDisplay() {
            document.getElementById('attempts-left').innerText = `ESSAIS : ${attempts}`;
            document.getElementById('stat-win').innerText = stats.wins;
            document.getElementById('stat-loss').innerText = stats.losses;
            document.getElementById('stat-oneshot').innerText = stats.oneshots;
            renderLine();
            renderMisplaced();
        }

        function showToast(text) {
            const t = document.getElementById('msg-toast');
            t.innerText = text;
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 1500);
        }

        function renderLine() {
            const container = document.getElementById('input-line');
            container.innerHTML = "";
            for (let i = 0; i < 8; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (fixedLetters[i]) {
                    tile.classList.add('correct');
                    tile.innerText = fixedLetters[i];
                } else {
                    tile.innerText = currentGuess[i];
                    if (currentGuess[i]) tile.classList.add('pop');
                }
                container.appendChild(tile);
            }
        }

        function renderMisplaced() {
            const container = document.getElementById('misplaced-container');
            container.innerHTML = "";
            misplacedLetters.forEach(l => {
                const el = document.createElement('div');
                el.className = 'misplaced-letter';
                el.innerText = l;
                container.appendChild(el);
            });
        }

        function endGame(win) {
            setTimeout(() => {
                const overlay = document.getElementById('overlay');
                overlay.style.display = "flex";
                document.getElementById('res-title').innerText = win ? "VICTOIRE" : "DÉFAITE";
                document.getElementById('res-word').innerText = `LE MOT ÉTAIT : ${targetWord}`;
            }, 500);
        }

        window.addEventListener('keydown', (e) => handleInput(e.key.toUpperCase()));
        initGame();
    </script>
</body>
</html>
