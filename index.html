<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA WORD MASTER - 8 LETTRES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="Mots.js"></script>
    <script src="Dictionnaire.js"></script>
    <style>
        :root {
            --pink-correct: #ff2d75;
            --purple-misplaced: #7f00ff;
            --blue-text: #00d4ff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            background: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        .stats {
            margin-top: 10px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--blue-text);
            text-transform: uppercase;
        }

        /* Grille adaptative pour mobile */
        #input-line {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
        }

        .tile {
            aspect-ratio: 1/1;
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            background: var(--glass);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        @media (min-width: 600px) {
            .tile { font-size: 2.2rem; border-radius: 12px; }
            #input-line { gap: 10px; }
        }

        .tile.pop { border-color: var(--blue-text); transform: scale(1.05); }
        .tile.correct { background: var(--pink-correct); border-color: transparent; box-shadow: 0 0 15px var(--pink-correct); }

        /* Clavier Virtuel pour Mobile */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-top: auto;
            padding-bottom: 20px;
        }

        .key-row { display: flex; justify-content: center; gap: 4px; }
        .key {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 4px;
            padding: 15px 10px;
            min-width: 30px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            text-align: center;
            user-select: none;
        }
        .key.wide { flex: 2; background: rgba(255,255,255,0.15); }
